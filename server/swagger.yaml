openapi: 3.0.3
info:
  title: Task Management API
  version: 1.0.0
  description: Production-ready REST API for managing authenticated users, projects, tasks, and dashboard analytics.
servers:
  - url: http://localhost:5000

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

paths:
  # ==================== AUTHENTICATION ====================
  /api/auth/register:
    post:
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [Admin, Member]
      responses:
        '201':
          description: User registered successfully

  /api/auth/login:
    post:
      summary: Authenticate user & get JWT token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful

  /api/auth/me:
    get:
      summary: Get current authenticated user profile
      responses:
        '200':
          description: User profile retrieved successfully

  # ==================== PROJECTS ====================
  /api/projects:
    get:
      summary: List all projects accessible to the authenticated user
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: Projects retrieved successfully
    post:
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Project created successfully

  /api/projects/{id}:
    get:
      summary: Get project details by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project details retrieved
    put:
      summary: Update project details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Project updated successfully
    delete:
      summary: Delete a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project deleted successfully

  /api/projects/{id}/members:
    post:
      summary: Add a member to a project (Admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
      responses:
        '200':
          description: Member added successfully

  /api/projects/{id}/members/{userId}:
    delete:
      summary: Remove a member from a project (Admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Member removed successfully

  # ==================== TASKS ====================
  /api/tasks:
    get:
      summary: List accessible tasks with filtering, search, sorting, and pagination
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [To Do, In Progress, Done]
        - in: query
          name: priority
          schema:
            type: string
            enum: [Low, Medium, High]
        - in: query
          name: assignee
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: sort
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: Tasks retrieved successfully
    post:
      summary: Create a new task inside a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, projectId]
              properties:
                title:
                  type: string
                description:
                  type: string
                projectId:
                  type: string
                status:
                  type: string
                  enum: [To Do, In Progress, Done]
                priority:
                  type: string
                  enum: [Low, Medium, High]
                dueDate:
                  type: string
                  format: date
                assignee:
                  type: string
      responses:
        '201':
          description: Task created successfully

  /api/tasks/{projectId}:
    get:
      summary: List tasks for a specific project
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: priority
          schema:
            type: string
        - in: query
          name: assignee
          schema:
            type: string
      responses:
        '200':
          description: Project tasks retrieved successfully

  /api/tasks/{id}:
    put:
      summary: Update task details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
                priority:
                  type: string
                dueDate:
                  type: string
                assignee:
                  type: string
      responses:
        '200':
          description: Task updated successfully
    delete:
      summary: Delete a task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task deleted successfully

  /api/tasks/{id}/status:
    put:
      summary: Update task status only
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [To Do, In Progress, Done]
      responses:
        '200':
          description: Task status updated successfully

  # ==================== STATISTICS ====================
  /api/stats:
    get:
      summary: Get dashboard analytics and task metrics
      responses:
        '200':
          description: Statistics retrieved successfully

  # ==================== USERS (ADMIN) ====================
  /api/users:
    get:
      summary: Get all system users (Admin only)
      responses:
        '200':
          description: Users list retrieved successfully